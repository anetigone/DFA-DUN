# DFA-DUN Training Configuration

# Model Configuration
model:
  K: 4  # Number of degradation types

# Training Configuration
training:
  lr: 5.0e-5
  batch_size: 8
  epochs: 100
  weight_decay: 1.0e-4

# Loss Weights
loss:
  lambda_freq: 0.1
  lambda_cls: 0.05

# Data Configuration
data:
  train_root: './data/Rain100L'
  val_root: './data/Rain100L'
  num_workers: 4
  pin_memory: true

# Checkpoint Configuration
checkpoint:
  save_dir: './checkpoints'
  save_interval: 10  # Validate every N epochs

# Logging Configuration
logging:
  log_dir: './logs'
  log_interval: 100  # Log every N iterations

# Device Configuration
device: 'cuda'  # 'cuda' or 'cpu'
